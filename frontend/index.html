<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="City energy analysis — Python simulation backend, browser renders only.">
<title>City Energy Analysis</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<canvas id="city" aria-label="Isometric city scene — click the building, car or person to query the analysis backend"></canvas>

<div id="hud" class="panel">
  <h1>City Energy Lab</h1>
  <div class="clock"><span id="clockText">--:--</span><span class="glyph" id="clockGlyph">☀️</span></div>
  <div class="stat" id="weatherRow" style="display:none"><span id="weatherIcon"></span><b id="weatherLabel">–</b></div>
  <div class="stat"><span>Buildings</span><b id="statBldg">–</b></div>
  <div class="stat"><span>Vehicles</span><b id="statCars">–</b></div>
  <div class="stat"><span>People</span><b id="statPop">–</b></div>
  <div class="stat"><span>Grid load</span><b id="statLoad">–</b></div>
  <div class="stat"><span>CO₂</span><b id="statCO2">–</b></div>
  <div class="stat"><span>Solar PV</span><b id="statPV">–</b></div>
  <div class="tools" id="toolbar">
    <button data-tool="car" title="Arm, then click a road to add a car (Esc to cancel)">+ 🚗 Car</button>
    <button data-tool="person" title="Arm, then click a road to add a person (Esc to cancel)">+ 🚶 Person</button>
    <button data-tool="road" title="Arm, then drag on the map to lay a road (snaps to a 10 m grid)">+ 🛣 Road</button>
    <button data-tool="bldg" title="Pick a type below, then drag a footprint on the map">+ 🏢 Bldg</button>
    <button data-tool="dozer" title="Arm, then click a building or road to bulldoze it">🧨 Doze</button>
    <button id="euiToggle" title="Toggle EUI heat-map: green=efficient, red=high energy">🌡 EUI</button>
  </div>
  <div class="tools" id="bldgTypes" style="display:none">
    <button data-btype="res" class="active">🏠 Res</button>
    <button data-btype="office">🏢 Office</button>
    <button data-btype="shop">🛍 Shop</button>
    <button data-btype="hospital">🏥 Hospital</button>
    <button data-btype="school">🏫 School</button>
    <button data-btype="industrial">🏭 Industrial</button>
  </div>
  <div class="backend" id="backendBadge"><span class="dot"></span><span id="backendText">connecting…</span></div>
  <div id="timeControls">
    <div id="timeSliderRow">
      <button id="playBtn" title="Play / Pause">⏸</button>
      <input id="timeSlider" type="range" min="0" max="1439" step="1" value="0" title="Drag to jump to a time of day">
    </div>
    <div id="speedRow">
      <button data-speed="1">1×</button>
      <button data-speed="10">10×</button>
      <button data-speed="60" class="active">60×</button>
      <button data-speed="360">360×</button>
    </div>
  </div>
</div>

<div id="popup" class="panel" role="dialog" aria-labelledby="popupTitle">
  <button class="close" id="popupClose" aria-label="Close">✕</button>
  <h2 id="popupTitle"></h2>
  <p class="sub" id="popupSub"></p>
  <canvas id="chart" width="640" height="360"></canvas>
  <p id="popupNow"></p>
  <div id="popupEdit">
    <span>Floors</span>
    <button id="floorMinus" aria-label="Remove a floor">−</button>
    <b id="floorVal">–</b>
    <button id="floorPlus" aria-label="Add a floor">+</button>
  </div>
  <div id="popupActions">
    <button id="entityRemove">🗑 Remove</button>
  </div>
</div>

<div id="toast" class="panel"><span class="dot"></span><span>Drag to pan, scroll to zoom. Click any <b>building</b>, <b>car</b> or <b>person</b>; results come from the Python backend.</span></div>

<div id="tooltip"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
