<svg viewBox="0 0 440 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, system-ui, sans-serif" role="img" aria-label="Building detail panel: live metric tiles and a 24-hour load chart">
  <rect x="0" y="0" width="440" height="340" rx="16" fill="#0d1222" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="20" y="34" fill="#eef2fa" font-size="16" font-weight="600">Gonville &amp; Caius Library</text>
  <text x="20" y="54" fill="#aab4cc" font-size="12">Office · 2 floors · 730 m² — electricity, last 24 h</text>
  <line x1="20" y1="66" x2="420" y2="66" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- chart well -->
  <rect x="20" y="78" width="400" height="86" rx="9" fill="#080c1c" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08"/>
  <path d="M30,150 L70,140 L110,120 L150,124 L190,150 L230,156 L270,150 L320,108 L360,112 L410,98"
        fill="none" stroke="#ffc94d" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M30,150 L70,140 L110,120 L150,124 L190,150 L230,156 L270,150 L320,108 L360,112 L410,98 L410,158 L30,158 Z"
        fill="#ffc94d" fill-opacity="0.14"/>
  <circle cx="410" cy="98" r="3.5" fill="#ffc94d"/>

  <!-- hero tile -->
  <g transform="translate(20,178)">
    <rect width="400" height="44" rx="9" fill="#ffc94d" fill-opacity="0.07" stroke="#ffc94d" stroke-opacity="0.22"/>
    <rect width="2.5" height="44" fill="#ffc94d"/>
    <text x="12" y="18" fill="#7f8aa6" font-size="10" font-weight="600" letter-spacing="0.7">POWER NOW</text>
    <text x="12" y="37" fill="#ffc94d" font-size="20" font-weight="700">18<tspan font-size="11" fill="#7f8aa6"> kW</tspan></text>
  </g>

  <!-- 2x2 tiles -->
  <g transform="translate(20,228)" font-size="13">
    <g transform="translate(0,0)">
      <rect width="196" height="44" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="2.5" height="44" fill="#5fd4a8"/>
      <text x="12" y="18" fill="#7f8aa6" font-size="10" font-weight="600" letter-spacing="0.7">SOLAR PV</text>
      <text x="12" y="37" fill="#eef2fa" font-weight="600">4.8<tspan font-size="11" fill="#7f8aa6"> kW</tspan></text>
    </g>
    <g transform="translate(204,0)">
      <rect width="196" height="44" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="2.5" height="44" fill="#ff9d6b"/>
      <text x="12" y="18" fill="#7f8aa6" font-size="10" font-weight="600" letter-spacing="0.7">CO₂</text>
      <text x="12" y="37" fill="#eef2fa" font-weight="600">4.1<tspan font-size="11" fill="#7f8aa6"> kg/h</tspan></text>
    </g>
    <g transform="translate(0,50)">
      <rect width="196" height="44" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="2.5" height="44" fill="#7aa7ff"/>
      <text x="12" y="18" fill="#7f8aa6" font-size="10" font-weight="600" letter-spacing="0.7">INDOOR</text>
      <text x="12" y="37" fill="#eef2fa" font-weight="600">24.0<tspan font-size="11" fill="#7f8aa6"> °C</tspan></text>
    </g>
    <g transform="translate(204,50)">
      <rect width="196" height="44" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect width="2.5" height="44" fill="#ff9d6b"/>
      <text x="12" y="18" fill="#7f8aa6" font-size="10" font-weight="600" letter-spacing="0.7">OUTDOOR</text>
      <text x="12" y="37" fill="#eef2fa" font-weight="600">22.6<tspan font-size="11" fill="#7f8aa6"> °C</tspan></text>
    </g>
  </g>
</svg>
